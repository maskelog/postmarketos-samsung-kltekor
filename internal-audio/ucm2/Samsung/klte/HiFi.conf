# Samsung Galaxy S5 (klte): QDSP6 MultiMedia1 -> SLIMBUS_0_RX -> WCD9320.
# Values from Samsung's klte mixer_paths.xml (LineageOS klte-common).
# All outputs share one PCM; only the codec routing differs.
# Headphones are selected by the "Headphone Jack" control (WCD9320 MBHC
# insertion comparator); without a plug the speaker is used.

SectionVerb {
	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='SLIM RX2 MUX' AIF1_PB"
	]

	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='SLIM RX2 MUX' ZERO"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
		"Earpiece"
	]

	EnableSequence [
		cset "name='RX7 MIX1 INP1' RX1"
		cset "name='RX7 MIX1 INP2' RX2"
		cset "name='RX7 Digital Volume' 79"
		cset "name='SPK DRV Volume' 8"
		cset "name='COMP0 Switch' 1"
		cset "name='DAC1 Switch' 1"
	]

	DisableSequence [
		cset "name='DAC1 Switch' 0"
		cset "name='COMP0 Switch' 0"
		cset "name='RX7 MIX1 INP2' ZERO"
		cset "name='RX7 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='CLASS_H_DSM MUX' DSM_HPHL_RX1"
		cset "name='RX1 Digital Volume' 77"
		cset "name='RX2 Digital Volume' 77"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
		cset "name='HPHL DAC Switch' 1"
	]

	DisableSequence [
		cset "name='HPHL DAC Switch' 0"
		cset "name='CLASS_H_DSM MUX' ZERO"
		cset "name='RX2 MIX1 INP1' ZERO"
		cset "name='RX1 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='CLASS_H_DSM MUX' DSM_HPHL_RX1"
		cset "name='RX1 Digital Volume' 84"
		cset "name='EAR PA Gain' POS_3_DB"
		cset "name='DAC1 Switch' 1"
	]

	DisableSequence [
		cset "name='DAC1 Switch' 0"
		cset "name='CLASS_H_DSM MUX' ZERO"
		cset "name='RX1 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}
